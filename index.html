<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{overflow:hidden;background:#0e0f12;color:#ece6d8;font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

/* ─── Loading ─── */
#loading{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e0f12;gap:18px}#loading h1{font:700 42px 'Barlow Condensed';color:#f2b33d;letter-spacing:2px;text-transform:uppercase}
#loading p{font:500 15px 'Barlow';color:#7a7768;letter-spacing:.5px}
.bar-wrap{width:260px;height:6px;border-radius:3px;background:#1b1d22;overflow:hidden}
#loadbar{height:100%;width:0;background:linear-gradient(90deg,#f2b33d,#e08a2a);border-radius:3px;transition:width .35s}

/* ─── Fade overlay ─── */
#fade{position:fixed;inset:0;background:#0e0f12;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#fade.on{opacity:1}

/* ─── GTA HUD ─── */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10}
.hud-row{display:flex;align-items:flex-start;padding:12px 18px 0;gap:12px;pointer-events:none}
.hud-row>*{pointer-events:auto}

/* top bar */
#srcchip{font:600 12px 'JetBrains Mono';color:#5fd08a;background:#1b1d22cc;padding:4px 12px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
#p-wrap{display:flex;align-items:center;gap:8px;background:#1b1d22cc;border-radius:10px;padding:5px 14px 5px 6px}
#p-av{width:30px;height:30px;border-radius:50%;background:#2a7a5a;display:flex;align-items:center;justify-content:center;font:700 12px 'Barlow Condensed';color:#fff}
#p-name{font:600 14px 'Barlow Condensed';color:#ece6d8}

/* stars + money (GTA-style) */
#stars{font-size:22px;color:#3a3d45;letter-spacing:2px}
#stars .on{color:#f2b33d}
#stars-label{display:block;font:500 11px 'JetBrains Mono';color:#7a7768;margin-top:2px}
#money{font:700 22px 'Barlow Condensed';color:#5fd08a;background:#1b1d22cc;padding:4px 14px;border-radius:8px;letter-spacing:1px}
#money small{font-size:13px;color:#7a7768;font-weight:500}
#clock{font:700 38px 'Anton';color:#f2b33dee;letter-spacing:3px;text-shadow:0 2px 12px #0008;margin-left:auto}

/* quest tracker */
#quest{position:fixed;top:82px;right:18px;background:#1b1d22cc;border-left:3px solid #f2b33d;padding:8px 14px;border-radius:0 8px 8px 0;max-width:260px;pointer-events:auto;z-index:10}
#quest-label{font:600 11px 'JetBrains Mono';color:#f2b33d;text-transform:uppercase;letter-spacing:1px}
#quest-text{font:500 13px 'Barlow';color:#9b9789;margin-top:3px}

/* bottom bar */
#bottom{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;padding:0 18px 14px;gap:12px;pointer-events:none;z-index:10}
#bottom>*{pointer-events:auto}

/* minimap */
.mm-wrap{width:200px;height:148px;border-radius:12px;overflow:hidden;border:2px solid #f2b33d44;background:#1b1d22;flex-shrink:0}
#minimap{width:200px;height:148px}

/* buttons */
.btns{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-end}
.btns button{font:600 12px 'JetBrains Mono';color:#ece6d8;background:#1b1d22cc;border:1px solid #2c2f3788;border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btns button:hover{background:#2c2f37}
.btns button kbd{display:inline-block;background:#f2b33d22;color:#f2b33d;padding:1px 6px;border-radius:4px;margin-right:6px;font-size:11px}

/* fps */
#fps{position:fixed;bottom:14px;right:18px;font:500 11px 'JetBrains Mono';color:#5a5d65;z-index:10;pointer-events:none}

/* ─── Interaction prompt ─── */
#prompt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1b1d22ee;border:1px solid #f2b33d55;border-radius:12px;padding:10px 22px;font:600 14px 'Barlow';color:#ece6d8;cursor:pointer;z-index:20;text-align:center;pointer-events:auto;min-width:160px;backdrop-filter:blur(6px)}
#prompt kbd{display:inline-block;background:#f2b33d33;color:#f2b33d;padding:1px 8px;border-radius:5px;margin-right:8px;font:600 13px 'JetBrains Mono'}
#prompt small{display:block;font:500 11px 'JetBrains Mono';color:#7a7768;margin-top:3px}

/* ─── Banner ─── */
#banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;text-align:center;pointer-events:none}
#banner-t{font:700 52px 'Barlow Condensed';color:#f2b33d;text-transform:uppercase;letter-spacing:4px;text-shadow:0 4px 24px #000a;animation:bannerIn .5s ease-out}
#banner-s{font:500 16px 'Barlow';color:#9b9789;margin-top:6px}
#banner.bad #banner-t{color:#ef5b4c}
@keyframes bannerIn{from{opacity:0;transform:translateY(20px)scale(.95)}to{opacity:1;transform:none}}

/* ─── Toast ─── */
#toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:#1b1d22ee;border:1px solid #2c2f3788;border-radius:10px;padding:8px 20px;font:500 13px 'Barlow';color:#ece6d8;z-index:30;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px)}

/* ─── Panel (monitor overlay) ─── */
#panel-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0008;backdrop-filter:blur(4px)}
.monitor{background:#12141a;border:2px solid #f2b33d44;border-radius:16px;width:min(540px,92vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 64px #000a}
.mon-head{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid #1e2028;gap:12px}
.mon-head h3{font:700 20px 'Barlow Condensed';color:#ece6d8;margin:0}
.mon-head .crumb{font:600 10px 'JetBrains Mono';color:#f2b33d;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.mon-head .x{font:600 13px 'JetBrains Mono';color:#7a7768;background:none;border:1px solid #2c2f37;border-radius:8px;padding:4px 12px;cursor:pointer}
.mon-head .x:hover{color:#ece6d8;border-color:#f2b33d}
.mon-body{flex:1;overflow-y:auto;padding:16px 20px;font:500 14px 'Barlow';color:#9b9789;line-height:1.6}
.mon-body .tile{background:#1b1d22;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.mon-body .tile .l{font:600 11px 'JetBrains Mono';color:#f2b33d;text-transform:uppercase;letter-spacing:1px}
.mon-body .tile .v{font:700 24px 'Barlow Condensed';color:#ece6d8;margin-top:4px}
.mon-body .tile .s{font:500 12px 'Barlow';color:#7a7768;margin-top:2px}
.mon-body .msg{font:600 16px 'Barlow';color:#ece6d8;margin-bottom:8px}
.mon-body .note{font:500 12px 'Barlow';color:#5a5d65;margin-top:8px}
.mon-foot{padding:10px 20px;border-top:1px solid #1e2028;font:500 11px 'JetBrains Mono';color:#3a3d45;text-align:right}

/* ─── Phone ─── */
#phone{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,88vw);max-height:70vh;background:#0e0f12;border:2px solid #f2b33d44;border-radius:24px;padding:24px 20px;z-index:55;overflow-y:auto}
#phone h4{font:700 18px 'Barlow Condensed';color:#ece6d8;margin-bottom:14px;letter-spacing:1px}
.apps{display:flex;flex-direction:column;gap:8px}
.app{display:flex;align-items:center;gap:10px;background:#1b1d22;border:1px solid #2c2f3744;border-radius:12px;padding:12px 16px;font:600 14px 'Barlow';color:#ece6d8;cursor:pointer;text-align:left;transition:border-color .15s}
.app:hover{border-color:#f2b33d66}
.app span{margin-left:auto;font:500 11px 'JetBrains Mono';color:#7a7768}

/* ─── Choice dialog ─── */
#choice{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#12141aee;border:2px solid #f2b33d55;border-radius:16px;padding:18px 22px;z-index:55;min-width:280px;text-align:center;backdrop-filter:blur(8px)}
#choice .q{font:700 16px 'Barlow Condensed';color:#f2b33d;margin-bottom:12px}
#choice button{display:block;width:100%;background:#1b1d22;border:1px solid #2c2f37;border-radius:10px;padding:10px 16px;font:600 14px 'Barlow';color:#ece6d8;cursor:pointer;margin-bottom:6px;text-align:left;transition:border-color .15s}
#choice button:hover{border-color:#f2b33d}
#choice button kbd{display:inline-block;background:#f2b33d22;color:#f2b33d;padding:1px 8px;border-radius:5px;margin-right:8px;font:600 12px 'JetBrains Mono'}
#choice .hint{font:500 11px 'JetBrains Mono';color:#5a5d65;margin-top:8px}
</style>
</head>
<body>
<!-- Loading -->
<div id="loading">
  <h1 id="load-title">Virtual Office</h1>
  <p>Loading 3D environment…</p>
  <div class="bar-wrap"><div id="loadbar"></div></div>
</div>

<!-- Fade -->
<div id="fade"></div>

<!-- 3D canvas -->
<div id="scene"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-row">
    <span id="srcchip">● Loading…</span>
    <div class="spacer"></div>
    <div><div id="stars"></div><span id="stars-label"></span></div>
    <div id="money"></div>
    <div id="p-wrap"><div id="p-av">??</div><span id="p-name">Visitor</span></div>
    <span id="clock">--:--</span>
  </div>
</div>

<!-- Quest -->
<div id="quest">
  <div id="quest-label">Mission</div>
  <div id="quest-text">Loading…</div>
</div>

<!-- Bottom -->
<div id="bottom">
  <div class="mm-wrap"><canvas id="minimap" width="200" height="148"></canvas></div>
  <div class="btns">
    <button id="b-cam"><kbd>V</kbd>Camera: Follow</button>
    <button id="b-gfx"><kbd>G</kbd>GFX: High</button>
    <button id="b-phone"><kbd>Tab</kbd>Phone</button>
  </div>
</div>

<!-- FPS -->
<div id="fps" hidden></div>

<!-- Interaction prompt -->
<div id="prompt" hidden></div>

<!-- Banner -->
<div id="banner" hidden>
  <h2 id="banner-t"></h2>
  <p id="banner-s"></p>
</div>

<!-- Toast -->
<div id="toast" hidden></div>

<!-- Panel -->
<div id="panel-wrap" hidden></div>

<!-- Phone -->
<div id="phone" hidden></div>

<!-- Choice dialog -->
<div id="choice" hidden></div>

<script type="module">
import { VirtualOffice } from './src/engine.js'

async function boot() {
  const cfg = (await import('./office.config.js')).default
  const el = document.getElementById('load-title')
  if (el && cfg.title) el.textContent = cfg.title
  const game = new VirtualOffice(cfg)
  game.start()
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot)
} else {
  boot()
}
</script>
</body>
</html>
